<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pixel & Code Shop</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; }
        body { background-color: #0b0c10; color: #66fcf1; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .terminal-container { background-color: #1f2833; border: 4px solid #45f3ff; box-shadow: 0 0 20px #45f3ff, inset 0 0 10px #45f3ff; padding: 30px; max-width: 650px; width: 100%; text-align: center; border-radius: 4px; }
        h1 { font-size: 1.4rem; margin-bottom: 10px; text-shadow: 2px 2px #000; color: #fff; }
        .subtitle { font-size: 0.7rem; color: #c5a3ff; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }
        .product-list { list-style: none; display: flex; flex-direction: column; gap: 25px; text-align: left; }
        .product-card { border: 3px dashed #45f3ff; padding: 15px; background-color: #0b0c10; display: flex; flex-direction: column; gap: 12px; }
        .product-link { font-size: 0.8rem; color: #fff; text-decoration: none; text-shadow: 1px 1px #000; display: inline-block; }
        .product-link:hover { color: #45f3ff; text-decoration: underline; }
        .pixel-cart-btn { display: inline-flex; align-items: center; justify-content: center; align-self: flex-start; background-color: #ff0055; color: #fff; padding: 10px 15px; font-size: 0.6rem; text-decoration: none; text-transform: uppercase; cursor: pointer; border: 4px solid #000; box-shadow: 0 -4px #ff0055, 0 4px #ff0055, -4px 0 #ff0055, 4px 0 #ff0055; }
        .pixel-cart-btn:hover { background-color: #00ff66; color: #000; box-shadow: 0 -4px #00ff66, 0 4px #00ff66, -4px 0 #00ff66, 4px 0 #00ff66; }
        .view-cart-main { display: block; margin-top: 25px; color: #ff0055; font-size: 0.65rem; text-decoration: none; }
        .view-cart-main:hover { text-decoration: underline; color: #00ff66; }
    </style>
</head>
<body>
    <div class="terminal-container">
        <h1>[ RETRO DEV HUB ]</h1>
        <div class="subtitle">Pixel Art & Code Asset Shop</div>
        <ul class="product-list">
            <li class="product-card">
                <a href="sprite-pack.html" class="product-link">👾 2D Retro Sprite Pack ($5) &rarr;</a>
                <button onclick="addToCart('2D Retro Sprite Pack', 5, 'YOUR_SPRITE_PACK_GREENLIGHT_URL')" class="pixel-cart-btn">[+] ADD TO CART</button>
            </li>
            <li class="product-card">
                <a href="godot-template.html" class="product-link">🚀 Godot 4 Physics Template ($10) &rarr;</a>
                <button onclick="addToCart('Godot 4 Physics Template', 10, 'YOUR_GODOT_TEMPLATE_GREENLIGHT_URL')" class="pixel-cart-btn">[+] ADD TO CART</button>
            </li>
            <li class="product-card">
                <a href="bio-page.html" class="product-link">🌐 Custom Bio-Link Page ($15) &rarr;</a>
                <button onclick="addToCart('Custom Bio-Link Page', 15, 'YOUR_BIO_PAGE_GREENLIGHT_URL')" class="pixel-cart-btn">[+] ADD TO CART</button>
            </li>
        </ul>
        <a href="cart.html" class="view-cart-main">[ VIEW MY CART ]</a>
    </div>

    <script>
        function addToCart(name, price, payLink) {
            let cart = JSON.parse(localStorage.getItem('retroShopCart')) || [];
            // Add item to cart array
            cart.push({ name: name, price: price, link: payLink });
            localStorage.setItem('retroShopCart', JSON.stringify(cart));
            // Send user to cart page automatically
            window.location.href = "cart.html";
        }
    </script>
</body>
</html>
