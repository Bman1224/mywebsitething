<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Inventory Cart</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; }
        body { background-color: #0b0c10; color: #66fcf1; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .cart-container { background-color: #1f2833; border: 4px solid #ff0055; box-shadow: 0 0 20px #ff0055; padding: 30px; max-width: 600px; width: 100%; border-radius: 4px; }
        h1 { font-size: 1.1rem; color: #fff; margin-bottom: 25px; text-shadow: 2px 2px #000; text-align: center; }
        .cart-item { display: flex; justify-content: space-between; font-size: 0.65rem; border-bottom: 2px dashed #45f3ff; padding: 12px 0; color: #c5c6c7; }
        .empty-msg { font-size: 0.65rem; color: #ff0055; text-align: center; margin: 20px 0; }
        .total-box { display: flex; justify-content: space-between; font-size: 0.8rem; color: #00ff66; margin-bottom: 25px; padding-top: 10px; border-top: 4px double #00ff66; }
        .delivery-box { margin-bottom: 30px; border: 2px solid #45f3ff; padding: 15px; background-color: #0b0c10; }
        label { display: block; font-size: 0.55rem; color: #fff; margin-bottom: 10px; text-transform: uppercase; }
        .pixel-input { width: 100%; background-color: #1f2833; border: 3px solid #45f3ff; color: #00ff66; padding: 10px; font-size: 0.6rem; outline: none; }
        .pixel-input:focus { border-color: #ff0055; }
        .btn-row { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .checkout-btn { display: block; width: 100%; text-align: center; background-color: #00ff66; color: #000; padding: 15px; font-size: 0.7rem; text-transform: uppercase; border: 4px solid #000; font-weight: bold; cursor: pointer; }
        .checkout-btn:hover { background-color: #fff; box-shadow: 0 0 15px #00ff66; }
        .clear-btn { background: none; border: none; color: #ff0055; font-size: 0.55rem; cursor: pointer; text-transform: uppercase; }
        .clear-btn:hover { text-decoration: underline; }
        .back-link { font-size: 0.6rem; color: #45f3ff; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="cart-container">
        <h1>[ YOUR INVENTORY ]</h1>
        <div id="cartContent"></div>
        <div class="total-box">
            <span>TOTAL:</span>
            <span id="cartTotal">$0</span>
        </div>
        <div class="delivery-box" id="deliveryForm" style="display: none;">
            <label for="buyerEmail">Enter delivery email address:</label>
            <input type="email" id="buyerEmail" class="pixel-input" placeholder="PLAYER@EMAIL.COM" oninput="validateForm()">
        </div>
        <div class="btn-row">
            <button onclick="startCheckout()" id="checkoutBtn" class="checkout-btn" style="display: none;">PROCEED TO GREENLIGHT</button>
            <button onclick="clearCart()" class="clear-btn">[ CLEAR CART INVENTORY ]</button>
            <a href="./index.html" class="back-link">&larr; CONTINUE SHOPPING</a>
        </div>
    </div>
    <script>
        // CRITICAL CONGFIGURATION PORTAL LINK
        const glLink = "https://gl.me/u/fmMSWk6qfXdd"; 

        const products = {
            'sprite': { name: "2D Retro Sprite Pack", price: 5 },
            'godot': { name: "Godot 4 Physics Template", price: 10 },
            'bio': { name: "Custom Bio-Link Page", price: 15 }
        };

        function renderCart() {
            const itemCode = sessionStorage.getItem('checkoutItem');
            const display = document.getElementById('cartContent');
            const totalBox = document.getElementById('cartTotal');
            const form = document.getElementById('deliveryForm');
            const btn = document.getElementById('checkoutBtn');

            if (!itemCode || !products[itemCode]) {
                display.innerHTML = '<div class="empty-msg">YOUR CART IS CURRENTLY EMPTY</div>';
                totalBox.innerText = '$0';
                form.style.display = 'none';
                btn.style.display = 'none';
                return;
            }

            const activeItem = products[itemCode];
            display.innerHTML = `<div class="cart-item"><span>${activeItem.name}</span> <span>$${activeItem.price}</span></div>`;
            totalBox.innerText = `$${activeItem.price}`;
            form.style.display = 'block';
            btn.style.display = 'block';
            validateForm();
        }

        function validateForm() {
            const email = document.getElementById('buyerEmail').value;
            const btn = document.getElementById('checkoutBtn');
            if (email.includes('@') && email.includes('.')) {
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.style.cursor = "pointer";
            } else {
                btn.disabled = true;
                btn.style.opacity = "0.4";
                btn.style.cursor = "not-allowed";
            }
        }

        function startCheckout() {
            const email = document.getElementById('buyerEmail').value;
            if (!email.includes('@') || !email.includes('.')) return;
            
            sessionStorage.removeItem('checkoutItem');
            window.open(glLink, '_blank');
            window.location.href = "./index.html";
        }

        function clearCart() {
            sessionStorage.removeItem('checkoutItem');
            renderCart();
        }

        renderCart();
    </script>
</body>
</html>
