<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godot 4 Physics Template - Info</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Shared Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; }
        body { background-color: #0b0c10; color: #66fcf1; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .details-container { background-color: #1f2833; border: 4px solid #45f3ff; padding: 30px; max-width: 600px; width: 100%; border-radius: 4px; }
        h1 { font-size: 1.1rem; color: #fff; margin-bottom: 20px; text-shadow: 2px 2px #000; }
        p { font-size: 0.65rem; color: #c5c6c7; line-height: 1.8; margin-bottom: 20px; }
        .spec-list { font-size: 0.6rem; color: #c5a3ff; list-style: square; margin-left: 20px; margin-bottom: 30px; line-height: 2; }
        .btn-row { display: flex; gap: 15px; align-items: center; }
        .back-link { font-size: 0.6rem; color: #45f3ff; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .pixel-cart-btn { display: inline-flex; align-items: center; justify-content: center; background-color: #ff0055; color: #fff; padding: 10px 15px; font-size: 0.6rem; text-decoration: none; text-transform: uppercase; cursor: pointer; border: 4px solid #000; box-shadow: 0 -4px #ff0055, 0 4px #ff0055, -4px 0 #ff0055, 4px 0 #ff0055; }
        .pixel-cart-btn:hover { background-color: #00ff66; color: #000; box-shadow: 0 -4px #00ff66, 0 4px #00ff66, -4px 0 #00ff66, 4px 0 #00ff66; }
    </style>
</head>
<body>
    <div class="details-container">
        <h1>[ 🚀 GODOT 4 PHYSICS TEMPLATE ]</h1>
        <p>A robust character controller framework written from scratch using pure optimized GDScript architecture.</p>
        <ul class="spec-list">
            <li>Engine Target: Godot 4.x+ Standard</li>
            <li>Features: Coyote-time jumps, Wall cling logic</li>
            <li>Clean scripts with thorough documentation comments</li>
        </ul>
        <div class="btn-row">
            <a href="index.html" class="back-link">&larr; BACK TO SHOP</a>
            <button onclick="addToCart('Godot 4 Physics Template', 10, 'https://gl.me/u/fmMSWk6qfXdd')" class="pixel-cart-btn">ADD TO CART ($10)</button>
        </div>
    </div>
    <script>
        function addToCart(name, price, payLink) {
            let cart = JSON.parse(localStorage.getItem('retroShopCart')) || [];
            // Add item to cart array
            cart.push({ name: name, price: price, link: payLink });
            localStorage.setItem('retroShopCart', JSON.stringify(cart));
            // Send user to cart page automatically
            window.location.href = "cart.html";
        }
</body>
</html>
